name: Filter Healthy Tvbox Config

on:
  schedule:
    # 每天北京时间 8:00 左右跑一次（UTC 0:00）
    - cron: "0 0 * * *"
  workflow_dispatch:   # 支持手动触发

permissions:
  contents: write

jobs:
  filter:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run filter
        run: python3 scripts/filter_healthy.py

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add exports/healthy_clean.json
          git diff --cached --quiet || git commit -m "chore: auto-filter healthy.json $(date -u +%Y-%m-%d)"
          git push
